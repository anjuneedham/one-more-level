name: 2. Build signed Android App Bundle

# Run this whenever you want a fresh .aab to upload to Google Play. Requires
# the four ANDROID_* secrets described in "1. Generate release keystore" to
# already be set (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Restore the signing key from secrets
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build the release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Clean up the signing key from the runner
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - name: Upload the .aab
        uses: actions/upload-artifact@v4
        with:
          name: one-more-level-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
