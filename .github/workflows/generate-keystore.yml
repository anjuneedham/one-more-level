name: 1. Generate release keystore

# Run this ONCE, before the first release build. It creates the signing key
# that identifies "One More Level" as yours on Google Play forever - every
# future update must be signed with the same key. Re-running this workflow
# makes a brand new, unrelated key; do not run it again once you've used a
# key to publish, or Play will reject future updates as a different app.
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (an internal name for the key - fine to leave as-is)'
        default: 'onemorelevel'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate random passwords
        id: pw
        run: |
          echo "store_password=$(openssl rand -base64 24)" >> "$GITHUB_OUTPUT"
          echo "key_password=$(openssl rand -base64 24)" >> "$GITHUB_OUTPUT"

      - name: Generate the keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ steps.pw.outputs.store_password }}" \
            -keypass "${{ steps.pw.outputs.key_password }}" \
            -dname "CN=One More Level, OU=Yardscale Digital, O=Yardscale Digital, C=US"

      - name: Encode the keystore for copy/paste into a GitHub secret
        run: base64 -w0 release.keystore > release.keystore.base64.txt

      - name: Write the setup instructions
        run: |
          cat > READ_ME_FIRST.txt <<EOF
          ============================================================
          KEEP release.keystore SOMEWHERE SAFE AND PERMANENT.
          ============================================================
          This is the ONLY copy. It cannot be regenerated. If you lose
          it, you can NEVER publish an update to this app again under
          this Play Store listing - you would have to start over as a
          brand new app, losing all reviews, installs and ratings.

          Save release.keystore itself (not just this text file) to
          somewhere that survives - email it to yourself, save it to
          Google Drive, etc.

          ============================================================
          NEXT STEP: add 4 secrets to your GitHub repository
          ============================================================
          Go to: your repo -> Settings -> Secrets and variables ->
          Actions -> "New repository secret", and add these four,
          exactly as named:

          Name: ANDROID_KEYSTORE_BASE64
          Value: the full contents of release.keystore.base64.txt
                 (open that file, select all, copy, paste as the value)

          Name: ANDROID_KEY_ALIAS
          Value: ${{ inputs.key_alias }}

          Name: ANDROID_KEYSTORE_PASSWORD
          Value: ${{ steps.pw.outputs.store_password }}

          Name: ANDROID_KEY_PASSWORD
          Value: ${{ steps.pw.outputs.key_password }}

          ============================================================
          THEN
          ============================================================
          1. Once all 4 secrets are saved, come back to the Actions tab
             and run "2. Build signed Android App Bundle".
          2. Once you've saved release.keystore somewhere permanent and
             copied the 4 secrets in, delete this workflow run's
             artifact (open this run -> Artifacts -> the trash icon)
             so the keystore doesn't sit downloadable in GitHub for
             the full 7-day retention window.
          EOF

      - name: Upload keystore and instructions
        uses: actions/upload-artifact@v4
        with:
          name: keystore-and-instructions
          path: |
            release.keystore
            release.keystore.base64.txt
            READ_ME_FIRST.txt
          retention-days: 7
